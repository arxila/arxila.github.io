# Projects shown on https://arxila.io
#
# Each list names repositories of the "arxila" GitHub organization, in the order
# they appear on the site. Descriptions are taken from GitHub on every build.
# Repositories not listed here are not shown. A listed repository that is not
# (yet) public is skipped with a warning, so it can be added in advance.

active = [
    "aiplam",
    "atomichash",
    "javatuples",
    "javaruntype",
]

development = [
    "vexprel",
]

archived = [
    "op4j",
    "javagalician",
]


# Other projects by the same author, outside the arxila organization, shown in a
# "See also" section at the end of the page. Entries are "owner/repo".

see_also = [
    "thymeleaf/thymeleaf",
    "attoparser/attoparser",
    "unbescape/unbescape",
]


# Go vanity import paths served from arxila.io.
# Key: path under arxila.io (module "arxila.io/<key>").
# Value: repository of the "arxila" organization that holds the module.

[go]
aiplam = "aiplam"
